                <div class="pasos_seleccion">
                    <div class="circulo1"><div class="circulo_interno"></div></div>
                    <div class="linea1"></div>

                    <label class="card" for="ios">
                        <span class="card_icon"><i class="fa-brands fa-apple"></i></span>

                            <div class="text_card"><p>Aplicaciones para iPhone y iPad</p></div>

                    <label class="card" for="android">
                        <span class="card_icon"><i class="ti ti-brand-android"></i></span>
                        <div class="card_text">
                            <div class="checkbox"><input type="checkbox" name="plataforma" id="android"></div>
                            <div class="title_card"><h2>Android</h2></div>
                            <div class="text_card"><p>Aplicaciones para dispositivos Android.</p></div>
                        </div>
                    </label>
                    <label class="card">
                        <span class="card_icon" for="web"><i class="ti ti-world"></i></span>
                        <div class="card_text">
                            <div class="checkbox"><input type="checkbox" name="plataforma" id="web"></div>
                            <div class="title_card"><h2>Web</h2></div>
                            <div class="text_card"><p>Aplicaciones y sitios web accesibles</p></div>
                        </div>
                    </label>
